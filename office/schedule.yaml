# Recurring jobs. The scheduler enqueues each as a task on the board when it is due.
# every: daily | weekdays | weekly (+ day:) | hourly (+ hours:)   at: HH:MM London   after: <job>   window_hours: default 6

- name: morning-job-scan
  every: daily
  at: 08:00
  agent: job-scout
  priority: 4
  title: 'Daily scan: new junior/graduate ML, AI and CV roles in London'
  task: 'Find new junior / graduate Machine Learning Engineer, AI Engineer and Computer Vision roles in London posted
    in the last 2 days (days=2). Skip anything already in the brain. Log fit >= 3 and give a ranked list. Keep it
    to the 5 best.

    '
- name: morning-digest
  every: daily
  at: 08:30
  after: morning-job-scan
  agent: chief-of-staff
  priority: 3
  title: Morning digest for Pribin
  task: 'Write a short morning digest: new jobs found since yesterday (brain, kind job), open tasks and anything
    blocked (task_list), pending approvals, yesterday''s sprint result (brain, tag sprint), and the single most
    useful thing Pribin should do today. Max 12 lines. Store it in the brain as kind=event with tag digest, then
    notify Pribin with a one-line summary.

    '
- name: daily-dev-sprint
  every: weekdays
  at: '10:00'
  agent: project-manager
  priority: 4
  title: 'Run today''s sprint: one finished, tested, committed milestone'
  task: 'Run today''s sprint from workspace/roadmap.md. Pick one milestone that can be finished today, get it built,
    tested, reviewed, committed and pushed to Pribin''s GitHub by release-manager, update the roadmap, and report
    what shipped.

    '
- name: pipeline-update
  every: weekdays
  at: '18:00'
  agent: tracker
  priority: 2
  title: Evening pipeline update
  task: 'Update pipeline/jobs.md and pipeline/clients.md from today''s events and create follow-up tasks for anything
    overdue. Use write_file; never report a change you did not write.

    '
- name: weekly-research
  every: weekly
  day: monday
  at: 09:00
  agent: ml-researcher
  priority: 3
  title: Weekly ML research and project proposals
  task: 'Do the weekly research pass: skills employers keep asking for (from brain jobs), 3-5 recent credible ML
    items, and 2-3 proposed projects appended to roadmap.md.

    '
- name: weekly-brain-gardening
  every: weekly
  day: sunday
  at: '20:00'
  agent: chief-of-staff
  priority: 2
  title: Weekly brain gardening
  task: 'Tidy the shared brain: brain_recent limit 100. Delete (brain_forget) job postings older than 30 days and
    exact duplicates; merge near-duplicates with brain_update; raise importance of facts other agents keep recalling.
    Store one kind=event summary of what you cleaned.

    '
- name: paper-portfolio-summary
  every: weekdays
  at: '17:30'
  agent: portfolio-tracker
  priority: 2
  enabled: true
  title: Paper portfolio daily summary
  task: 'Write today''s paper portfolio summary. If the book does not exist yet, create it with cash 10000 and say
    so.

    '
- name: interview-drill
  every: weekdays
  at: 07:30
  agent: interview-coach
  priority: 3
  title: Daily interview drill
  task: 'Daily drill: one ML fundamentals question and one project deep-dive question for today, written to interviews/drills/<date>.md
    with hidden model answers. Vary topics; check weak-spot lessons first.

    '
- name: weekly-review
  every: weekly
  day: monday
  at: 09:30
  agent: chief-of-staff
  priority: 4
  title: Weekly review vs the 90-day plan
  task: 'Run the scorecard for the last 7 days, compare every number with the weekly targets in workspace/plan-90-days.md,
    write what moved, what stalled, and ONE change for this week. Store as kind=event tag review and notify Pribin
    with the headline.

    '
- name: weekly-networking
  every: weekly
  day: tuesday
  at: '11:00'
  agent: networker
  priority: 3
  title: Warm paths for this week's target companies
  task: 'For the 3 newest jobs in the brain with fit >= 4, find up to 3 relevant people each and draft connection
    notes and follow-ups. Request approval per company.

    '
- name: weekly-eval
  every: weekly
  day: saturday
  at: '11:00'
  command: .venv/bin/python office/eval/run_eval.py --quick
  priority: 2
  title: Weekly agent eval (fabrication and success rate per provider)
- name: weekly-publish
  every: weekly
  day: friday
  at: '17:00'
  command: ./office/publish.sh
  priority: 2
  title: Publish the public portfolio repo from the dev repo
- name: daily-optimisation
  every: daily
  at: 07:00
  agent: coo
  priority: 4
  title: 'COO: daily optimisation pass'
  task: 'Optimisation pass: ops_metrics 24h vs yesterday''s ops-review memory; revert what made things worse, set
    today''s knobs, propose at most one brief change with evidence.'
- name: weekly-deep-review
  every: weekly
  day: sunday
  at: '19:00'
  agent: coo
  priority: 3
  title: 'COO: weekly deep review'
  task: 'Weekly deep review: rank agents by value per token, propose at most 3 brief changes, write workspace/ops/weekly-review.md.'

# ---- trading desk, round the clock (DEMO). The watch and the sweep are scripts: no model, no token cost.
- name: trading-watch
  every: hourly
  priority: 5
  title: Trading watch (all markets)
  command: python office/trading_watch.py
- name: strategy-lab-sweep
  every: daily
  at: '02:00'
  window_hours: 4
  priority: 2
  title: Strategy lab sweep (all markets, walk-forward)
  command: python office/trading_lab.py
- name: market-pulse-am
  every: weekdays
  at: '07:30'
  agent: market-researcher
  priority: 2
  title: Market pulse, London open (DEMO desk)
  task: 'Market pulse for the London open: read trading/watch-last.json and trading/lab-sweep.md (top lines), then live quotes for
    the markets with approved strategies plus GOLD, US500, EURUSD, BTCUSD. Flag notable moves and scheduled news that could hit
    them today; store one fact per notable move (namespace trading). 10 lines.'
- name: market-pulse-mid
  every: weekdays
  at: '13:00'
  agent: market-researcher
  priority: 2
  title: Market pulse, New York open (DEMO desk)
  task: 'Market pulse for the New York open: same as the morning pulse, focused on US indices, USD pairs, gold and oil. 10 lines.'
- name: market-pulse-pm
  every: weekdays
  at: '18:00'
  agent: market-researcher
  priority: 2
  title: Market pulse, evening (DEMO desk)
  task: 'Evening market pulse: what moved today across currencies, indices, commodities and crypto, open positions (if any), and
    what the overnight session (Asia) could bring. Store one fact per notable move. 10 lines.'
- name: crypto-pulse
  every: daily
  at: '11:00'
  agent: market-researcher
  priority: 2
  title: Crypto pulse (DEMO desk, every day)
  task: 'Crypto pulse: BTCUSD, ETHUSD, SOLUSD, XRPUSD, ADAUSD, LTCUSD live quotes and notable moves; crypto trades every day, so
    this also covers weekends. Store one fact per notable move (namespace trading). 8 lines.'

# ---- CEO layer: the approval digest (script, no tokens): most valuable items first, pushed to the phone
- name: approval-digest-am
  every: daily
  at: '08:15'
  priority: 5
  title: Approval digest (morning)
  command: python office/ceo.py digest
- name: approval-digest-pm
  every: daily
  at: '17:45'
  priority: 5
  title: Approval digest (evening)
  command: python office/ceo.py digest
