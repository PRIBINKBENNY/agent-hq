<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent HQ">
<meta name="theme-color" content="#080b14">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Agent HQ</title>
<style>
  :root { --bg:#080b14; --panel:#10151f; --panel-2:#171d2a; --line:#232b3a; --ink:#e6eaf2; --ink-2:#a3adbf; --ink-3:#8b96aa;
          --think:#5b8def; --tool:#e0a93b; --done:#3ec28f; --err:#ef5b6e; --accent:#5b8def; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px); }
  header { position: sticky; top:0; z-index:5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); padding: 12px 16px; display:flex; align-items:center; gap:10px; }
  header b { font-size:17px; letter-spacing:.4px; } header .dot { width:9px; height:9px; border-radius:50%; background:var(--done); } header .dot.off { background:var(--err); }
  header .sp { margin-left:auto; font-size:12px; color:var(--ink-3); }
  .tiles { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; padding: 12px 16px 0; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
  .tile .k { font-size:10px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.5px; } .tile .v { font-size:18px; font-weight:700; }
  section { margin: 14px 16px 0; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  section h3 { margin:0; padding: 10px 14px; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-2); border-bottom:1px solid var(--line); display:flex; }
  section h3 .sp { margin-left:auto; font-weight:400; color:var(--ink-3); text-transform:none; letter-spacing:0; }
  .item { padding: 11px 14px; border-bottom:1px solid var(--line); font-size:14px; } .item:last-child { border-bottom:0; }
  .item .meta { color:var(--ink-3); font-size:12px; margin-top:3px; }
  .btns { display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .btns button { flex:1; min-width:84px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:10px 8px; border-radius:10px; font-size:14px; font-weight:600; }
  .btns .ok { border-color:var(--done); color:var(--done); } .btns .no { border-color:var(--err); color:var(--err); } .btns .view { color:var(--ink-2); }
  .st { font-size:10px; text-transform:uppercase; letter-spacing:.5px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); margin-right:6px; }
  .st.done, .st.pass { color:var(--done); border-color:var(--done);} .st.failed, .st.fail { color:var(--err); border-color:var(--err);} .st.running, .st.queued { color:var(--tool); border-color:var(--tool);}
  .empty { padding: 14px; color:var(--ink-3); font-size:13px; }
  .det { display:none; margin-top:10px; } .item.open .det { display:block; } .det h5 { margin:8px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-3); }
  .det .body { white-space:pre-wrap; font-size:13px; color:var(--ink-2); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; max-height:45vh; overflow:auto; }
  .more { background:none; border:0; color:var(--accent); font-size:14px; padding:8px 0; } .who { color:var(--ink-3); font-size:12px; margin-bottom:4px; }
  .cmd { position: fixed; left:0; right:0; bottom:0; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background: color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter: blur(10px); border-top:1px solid var(--line); display:flex; gap:8px; }
  .cmd input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:12px; border-radius:12px; font-size:16px; }
  .cmd button { background:var(--accent); border:0; color:#fff; padding:0 16px; border-radius:12px; font-size:15px; font-weight:700; } .cmd #mic { background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:0 12px; } .cmd #mic.on { border-color:var(--err); color:var(--err); }
  .feed .item { font-size:13px; } .feed b { color:var(--ink); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom: 96px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:10px 14px; border-radius:12px; font-size:13px; display:none; z-index:9; }
  .pre { white-space:pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; color:var(--ink-2); padding:12px 14px; max-height:50vh; overflow:auto; }
  .row { display:flex; gap:8px; padding: 10px 14px; } .row button { flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:10px; border-radius:10px; font-size:13px; }
  .kv { display:grid; grid-template-columns:1fr auto auto; gap: 3px 10px; padding: 10px 14px; font-size:13px; } .kv .k { color:var(--ink-2);} .kv .v { text-align:right;} .kv .t { color:var(--ink-3); text-align:right;} .kv .hit{color:var(--done)} .kv .miss{color:var(--tool)}
.agroup{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
  :root[data-theme="light"], :root:not([data-theme]) { }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]):not([data-theme="minimal"]) { --bg:#f3f5f9; --panel:#fff; --panel-2:#fff; --line:#e3e7ee; --ink:#151a24; --ink-2:#4a5468; --ink-3:#6b7588; } }
  :root[data-theme="light"] { --bg:#f3f5f9; --panel:#fff; --panel-2:#fff; --line:#e3e7ee; --ink:#151a24; --ink-2:#4a5468; --ink-3:#6b7588; }
  :root[data-theme="minimal"] { --bg:#fafafa; --panel:#fff; --panel-2:#fff; --line:#e8e8e8; --ink:#111; --ink-2:#555; --ink-3:#777; --done:#111; --think:#111; --tool:#555; }
  :root[data-theme="minimal"] section h3 { text-transform:none; letter-spacing:0; font-size:15px; font-weight:600; color:var(--ink); }
  .btns .more-sheet { display:none; width:100%; } .item.more .btns .more-sheet { display:contents; } .btns button.morebtn { opacity:.85; }
</style>
</head>
<body>
<header><span class="dot" id="conn"></span><b>AGENT HQ</b><span class="sp" id="engine">…</span></header>
<div id="banner" style="display:none;background:#3a2d0c;color:#f3d48a;padding:10px 16px;font-size:13px"></div>
<div class="tiles">
  <div class="tile"><div class="k">Agents</div><div class="v" id="t-agents">–</div></div>
  <div class="tile"><div class="k">Running</div><div class="v" id="t-running">–</div></div>
  <div class="tile"><div class="k">Open tasks</div><div class="v" id="t-tasks">–</div></div>
  <div class="tile"><div class="k">Approvals</div><div class="v" id="t-appr">–</div></div>
</div>

<section><h3>Approvals waiting for you <span class="sp" id="appr-sp"></span></h3><div id="approvals"></div></section>
<section><h3>Today <span class="sp" id="digest-sp"></span></h3><div id="digest" class="item" style="white-space:pre-wrap"></div></section>
<section><h3>Jobs <span class="sp" id="jobs-sp"></span></h3><div id="jobs"></div></section>
<section><h3>Projects <span class="sp" id="proj-sp"></span></h3><div id="projects"></div></section>
<section><h3>Outputs · 7 days <span class="sp" id="out-sp"></span></h3><div id="outputs"></div></section>
<section><h3>Task board <span class="sp" id="task-sp"></span></h3><div id="tasks"></div></section>
<section><h3>Scorecard · this week</h3><div id="scorecard"></div></section>
<section class="feed"><h3>Live feed <span class="sp" id="feed-sp"></span></h3><div id="feed"></div></section>
<section><h3>Phone</h3><div class="row"><button id="pausebtn" onclick="togglePause()">⏸ Pause office</button><button id="push">Enable notifications</button></div><div class="row"><button id="theme-btn" onclick="cycleTheme()">Theme: auto</button></div><div class="row"><button onclick="location.href='/linkedin/connect'" id="li-btn">Connect LinkedIn</button><button onclick="location.href='/'">Office floor</button></div>
  <div class="empty" id="push-status">Add this page to your Home Screen (Share → Add to Home Screen) to get an app icon and push notifications.</div></section>

<div class="cmd"><input id="task" placeholder="Give the office a command…"><button id="mic">🎤</button><button id="go">Run</button></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = ts => new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2600); }
const api = (p, body) => fetch(p, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : undefined).then(r => r.json());

async function refresh() {
  let s; try { const r = await fetch("/api/state"); if (!r.ok) throw new Error("server " + r.status); s = await r.json(); $("#conn").classList.remove("off"); } catch (e) { $("#conn").classList.add("off"); toast("Server error: " + e.message); return; }
  { const real = new Set((s.tasks || []).filter(t => t.status === "running").map(t => t.owner));   // truth, not just events
    if (typeof running !== "undefined") { [...running].forEach(n => { if (!real.has(n)) running.delete(n); }); }
    $("#t-running").textContent = real.size + (s.running || []).length; }
  $("#t-agents").textContent = s.roster.length;
  $("#t-tasks").textContent = s.tasks.filter(t => ["queued","running"].includes(t.status)).length;
  $("#t-appr").textContent = s.approvals.length; $("#appr-sp").textContent = s.approvals.length ? s.approvals.length + " pending" : "";
  $("#engine").textContent = (s.engine.providers || []).join(" → ") + (s.engine.ollama && s.engine.ollama !== "off" ? " → ollama" : "");
  const pz = s.paused || {}; const b = $("#banner"); b.style.display = pz.paused ? "block" : "none"; if (pz.paused) b.textContent = "OFFICE PAUSED" + (pz.reason ? " · " + pz.reason : "") + ". Nothing new starts until you resume.";
  $("#pausebtn").textContent = pz.paused ? "▶ Resume office" : "⏸ Pause office"; $("#pausebtn").dataset.paused = pz.paused ? "1" : "";
  $("#approvals").innerHTML = s.approvals.length ? groupApprovals(s.approvals).map((a, i, arr) => { const head = (!i || arr[i - 1].why !== a.why) ? `<div class="agroup">${esc(a.why || "other")} · ${arr.filter(x => x.why === a.why).length}</div>` : "";
    const paths = [...new Set((a.content.match(/(?:workspace\/)?([\w./-]+\/[\w.-]+\.(?:md|pdf))/g) || []).map(p => p.replace(/^workspace\//, "")))];
    const qa = a.tags.includes("qa-pass") ? `<span class="st pass">QA pass</span>` : a.tags.includes("qa-fail") ? `<span class="st fail">QA fail</span>` : a.tags.includes("qa-queued") ? `<span class="st queued">QA pending</span>` : "";
    const isApp = a.tags.includes("application") || /cv|cover letter|application/i.test(a.content);
    const isPost = /linkedin/i.test(a.content) && !a.tags.includes("posted");
    const isNet = a.agent === "networker"; const profiles = isNet ? [...new Set((a.content.match(/https?:\/\/(?:www\.)?linkedin\.com\/in\/[\w%-]+/g) || []))] : [];
      const netBtns = isNet ? paths.filter(p => p.includes("networking/")).map(p => `<button class="view" onclick="copyFile('${esc(p)}')">Copy ${esc(p.split("/").pop().replace(".md", ""))}</button>`).join("") + profiles.map(u => `<button class="ok" onclick="window.open('${esc(u)}','_blank')">Open profile</button>`).join("") : "";
      const postBtns = isPost ? paths.filter(p => p.includes("posts/")).map(p => `<span class="postset" data-id="${a.id}" data-path="${esc(p)}"><button class="ok" onclick="postLinkedIn(${a.id},'${esc(p)}')">Post ${esc(p.split("/").pop().replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(".md", ""))}</button></span>`).join("") : "";
    return `${head}<div class="item" id="appr-${a.id}"><div class="who">#${a.id} · ${esc(a.agent)} · ${esc(a.created)}</div>${qa}${esc(a.content.replace(/^(QA: \w+ - )?PENDING APPROVAL from [\w-]+: /, ""))}
      <div><button class="more" onclick="toggleApproval(${a.id})">Show details</button></div><div class="det"></div>
      <div class="btns"><button class="ok" onclick="act('/api/approve',{id:${a.id},decision:'approved'},'Approved')">Approve</button>${isApp ? `<button class="ok" onclick="act('/api/applied',{id:${a.id}},'Marked applied')">I applied</button>` : ""}${postBtns}${netBtns}<button class="no" onclick="rejectWithReason(${a.id})">Reject</button>${paths.map(p => `<button class="view" onclick="view('${esc(p)}')">${esc(p.split("/").pop())}</button>`).join("")}</div></div>`; }).join("")
    : `<div class="empty">Nothing waiting.</div>`;
  expandPostSets();
  const open = s.tasks.filter(t => ["queued","running","blocked"].includes(t.status)); $("#task-sp").textContent = open.length ? open.length + " open" : "";
  $("#tasks").innerHTML = s.tasks.length ? s.tasks.slice(0, 12).map(t => `<div class="item"><span class="st ${esc(t.status)}">${esc(t.status)}</span>${esc(t.title)}<div class="meta">${esc(t.owner)} · ${esc(t.created)}${t.result ? " · " + esc(String(t.result).slice(0, 120)) : ""}</div></div>`).join("") : `<div class="empty">No tasks.</div>`;
  const dg = s.memories.find(m => m.tags.includes("digest")); $("#digest").textContent = dg ? dg.content : "No digest yet today. The Chief of Staff writes one at 08:30."; $("#digest-sp").textContent = dg ? dg.created : "";
}
async function refreshOutputs() { const r = await api("/api/outputs?days=7"); const os_ = (r.outputs || []).slice(0, 20); $("#out-sp").textContent = os_.length ? `${(r.outputs || []).length} files` : "";
  $("#outputs").innerHTML = os_.length ? os_.map(o => `<div class="item"><b>${esc(o.name)}</b><div class="meta">${esc(o.folder)} · ${esc(o.updated)}${o.agent ? " · " + esc(o.agent) : ""}</div><div class="btns"><button class="view" onclick="view('${esc(o.path)}')">Open</button></div></div>`).join("") : `<div class="empty">Nothing yet.</div>`; }

async function refreshProjects() { const r = await api("/api/projects"); const ps = (r.projects || []).filter(p => p.status !== "stub").slice(0, 12);
  $("#proj-sp").textContent = ps.length ? `${ps.filter(p => p.github).length} on GitHub` : "";
  $("#projects").innerHTML = ps.length ? ps.map(p => `<div class="item"><span class="st ${esc(p.status.replace(/ /g, "-"))}">${esc(p.status)}</span><b>${esc(p.name)}</b><div class="meta">${p.files} files · ${esc(p.updated)}${p.last_agent ? " · " + esc(p.last_agent) : ""}${p.last_commit ? "<br>" + esc(p.last_commit) : ""}</div>${p.github ? `<div class="btns"><button class="ok" onclick="window.open('${esc(p.github)}','_blank')">Open on GitHub</button></div>` : ""}</div>`).join("") : `<div class="empty">No projects yet.</div>`; }

async function refreshJobs() {
  const r = await api("/api/jobs"); const jobs = (r.jobs || []).filter(j => !["rejected", "dismissed"].includes(j.status)).slice(0, 15);
  $("#jobs-sp").textContent = jobs.length ? jobs.length + " open" : "";
  $("#jobs").innerHTML = jobs.length ? jobs.map(j => `<div class="item"><span class="st ${esc(j.status)}">${esc(j.status)}</span><b>${esc(j.title)}</b> · ${esc(j.company)} · fit ${j.fit}/5
      <div class="meta">${esc(j.location)}${j.posted && j.posted !== "n/a" ? " · posted " + esc(j.posted) : ""}${j.needs ? "<br>Needs: " + esc(j.needs) : ""}</div>
      <div class="btns">${j.url ? `<button class="ok" onclick="window.open('${esc(j.url)}','_blank')">Open posting</button>` : ""}${j.application ? (j.url ? `<button class="ok" onclick="jobAct(${j.id},'prefill')">Pre-fill form</button>` : `<button class="view" onclick="view('${esc(j.application.cv)}')">CV</button>`) : `<button class="ok" onclick="jobAct(${j.id},'tailor')">Tailor CV</button>`}<button class="morebtn" onclick="this.closest('.item').classList.toggle('more')">More</button><span class="more-sheet">${j.application ? `<button class="view" onclick="view('${esc(j.application.cv)}')">CV</button>${j.application.pdf ? `<button class="view" onclick="view('${esc(j.application.pdf)}')">PDF</button>` : ""}${j.application.letter ? `<button class="view" onclick="view('${esc(j.application.letter)}')">Letter</button>` : ""}` : ""}${j.status !== "applied" ? `<button class="ok" onclick="jobStatus(${j.id},'applied')">I applied</button>` : ""}<button class="no" onclick="jobStatus(${j.id},'dismissed')">Dismiss</button></span></div></div>`).join("")
    : `<div class="empty">No open jobs yet.</div>`;
}
async function jobAct(id, action) { const r = await api("/api/jobs", { id, action }); toast(r.task ? `Queued as task #${r.task}` : (r.error || "done")); }
async function jobStatus(id, status) { await api("/api/jobs", { id, action: "status", status }); refreshJobs(); }
async function refreshStats() {
  const st = await api("/api/stats"); const c = st.scorecard || {}, t = c.targets_per_week || {};
  const rows = ["applications_tailored","applications_marked_applied","contacts_logged","proposals_drafted","posts_approved","mock_interviews","commits_on_github"];
  $("#scorecard").innerHTML = `<div class="kv">${rows.map(k => { const v = c[k] ?? "–", tg = t[k]; const cls = tg ? (Number(v) >= Number(tg) ? "hit" : "miss") : ""; return `<span class="k">${esc(k.replace(/_/g," "))}</span><span class="v ${cls}">${esc(v)}</span><span class="t">${tg ? "/ " + esc(tg) : ""}</span>`; }).join("")}</div>`;
}
const WHY_ORDER = ["a client or contact is waiting for a reply", "proposal", "job application", "post", "internal change"];
function groupApprovals(list) { const rank = a => { const w = a.why || "other"; const i = WHY_ORDER.findIndex(k => w.startsWith(k)); return i < 0 ? WHY_ORDER.length : i; }; return [...list].sort((x, y) => rank(x) - rank(y) || (x.why || "").localeCompare(y.why || "") || y.id - x.id); }
async function copyFile(p) { try { const r = await (await fetch("/api/file?path=" + encodeURIComponent(p))).json(); await navigator.clipboard.writeText(r.content || ""); toast("Copied: paste it into LinkedIn"); } catch (e) { toast("Copy failed: " + e); } }

async function rejectWithReason(id) { const reason = prompt("Why? One line (optional). It becomes a lesson for the agent.", ""); if (reason === null) return; act('/api/approve', { id, decision: 'rejected', reason }, reason ? 'Rejected, lesson stored' : 'Rejected'); }

function applyTheme(t) { if (t && t !== "auto") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; const b = $("#theme-btn"); if (b) b.textContent = "Theme: " + (t || "auto"); }
function cycleTheme() { const order = ["auto", "dark", "light", "minimal"]; let t = "auto"; try { t = localStorage.getItem("hq-m-theme") || "auto"; } catch (e) {} t = order[(order.indexOf(t) + 1) % order.length]; try { localStorage.setItem("hq-m-theme", t); } catch (e) {} applyTheme(t); }
try { applyTheme(localStorage.getItem("hq-m-theme") || "auto"); } catch (e) {}

async function postLinkedIn(id, path, variant) { if (!confirm(`Publish ${variant ? "variant " + variant : "this post"} to LinkedIn now?`)) return; const r = await api("/api/linkedin/post", { id, path, variant }); toast(r.posted ? "Posted to LinkedIn" : (r.error || "failed")); refresh(); }
function expandPostSets() { document.querySelectorAll(".postset:not([data-done])").forEach(el => { el.dataset.done = 1; const p = el.dataset.path, id = el.dataset.id; api("/api/linkedin/variants?path=" + encodeURIComponent(p)).then(v => { if (v.variants > 1) el.innerHTML = Array.from({ length: v.variants }, (_, i) => `<button class="ok" onclick="postLinkedIn(${id},'${p}',${i + 1})">Post v${i + 1}</button>`).join(""); }).catch(() => {}); }); }
async function toggleApproval(id) {
  const card = document.getElementById("appr-" + id); const det = card.querySelector(".det"); const btn = card.querySelector(".more");
  if (card.classList.contains("open")) { card.classList.remove("open"); btn.textContent = "Show details"; return; }
  if (!det.dataset.loaded) { const d = await api("/api/approval?id=" + id);
    det.innerHTML = (d.files || []).map(f => `<h5>${esc(f.name)}</h5><div class="body">${esc(f.content)}</div>`).join("") + (d.qa ? `<h5>QA report</h5><div class="body">${esc(d.qa)}</div>` : "") + ((d.files || []).length ? "" : `<div class="body">No file behind this approval; the note above is all there is.</div>`);
    det.dataset.loaded = "1"; }
  card.classList.add("open"); btn.textContent = "Hide details";
}
async function togglePause() { const p = !$("#pausebtn").dataset.paused; const r = await api("/api/pause", { paused: p, reason: p ? "paused from the phone" : "" }); toast(r.message); refresh(); }
async function act(url, body, msg) { const r = await api(url, body); toast(r.error || msg); refresh(); }
async function view(p) { if (p.endsWith(".pdf")) { window.open("/api/file?path=" + encodeURIComponent(p)); return; } const r = await api("/api/file?path=" + encodeURIComponent(p)); const d = document.createElement("section"); d.innerHTML = `<h3>${esc(p)} <span class="sp" onclick="this.closest('section').remove()">close</span></h3><div class="pre">${esc(r.content || r.error)}</div>`; $("#approvals").closest("section").after(d); d.scrollIntoView({ behavior: "smooth" }); }
$("#go").onclick = async () => { const task = $("#task").value.trim(); if (!task) return; const r = await api("/api/run", { task, agent: "chief-of-staff", engine: "auto" }); toast(r.started ? "Run started" : r.queued ? `Queued as task #${r.task_id}` : (r.error || "failed")); $("#task").value = ""; refresh(); };
$("#task").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
(() => { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; const mic = $("#mic"); if (!SR) { mic.style.opacity = .4; return; } let rec = null;
  mic.onclick = () => { if (rec) { rec.stop(); return; } rec = new SR(); rec.lang = "en-GB"; rec.interimResults = true; mic.classList.add("on");
    rec.onresult = e => { $("#task").value = Array.from(e.results).map(r => r[0].transcript).join(" "); }; rec.onend = () => { mic.classList.remove("on"); rec = null; }; rec.onerror = rec.onend; rec.start(); }; })();

/* live feed: SSE with the running count derived from events */
let running = new Set();
function connect() {
  const es = new EventSource("/api/events");
  const add = (e) => { if (["start","think","tool","delegate"].includes(e.type)) running.add(e.agent); if (["done","error"].includes(e.type)) running.delete(e.agent); $("#t-running").textContent = running.size;
    if (["start","tool","delegate","done","error","fallback"].includes(e.type)) { const d = document.createElement("div"); d.className = "item";
      const what = e.type === "start" ? "started · " + e.task : e.type === "tool" ? "→ " + e.tool : e.type === "delegate" ? "→ " + e.to : e.type === "done" ? "done · " + (e.answer || "") : e.type === "error" ? "error · " + e.detail : "switched to " + e.model;
      d.innerHTML = `<b>${esc(e.agent)}</b> <span style="color:var(--ink-3)">${hhmm(e.ts)}</span><div class="meta">${esc(String(what).slice(0, 160))}</div>`; const f = $("#feed"); f.prepend(d); while (f.children.length > 40) f.lastChild.remove(); } };
  es.addEventListener("snapshot", ev => { $("#feed").innerHTML = ""; running = new Set(); JSON.parse(ev.data).slice(-40).forEach(add); const now = Date.now()/1000; $("#conn").classList.remove("off"); });
  es.addEventListener("ev", ev => { add(JSON.parse(ev.data)); refresh(); });
  es.onerror = () => $("#conn").classList.add("off");
}

/* web push */
const b64ToU8 = b => { const p = "=".repeat((4 - b.length % 4) % 4); const r = (b + p).replace(/-/g, "+").replace(/_/g, "/"); const s = atob(r); return Uint8Array.from([...s].map(c => c.charCodeAt(0))); };
async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) { $("#push-status").textContent = "Push needs the Home Screen app on iOS 16.4+ (Share → Add to Home Screen), then open it from the icon."; return; }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js"); const perm = await Notification.requestPermission();
    if (perm !== "granted") { $("#push-status").textContent = "Notifications were not allowed."; return; }
    const { key } = await api("/api/vapid"); const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
    const r = await api("/api/push/subscribe", sub.toJSON()); $("#push-status").textContent = `Notifications on (${r.subscribers} device${r.subscribers > 1 ? "s" : ""}). You'll be pinged for approvals and finished tasks.`; $("#push").textContent = "Notifications enabled";
  } catch (e) { $("#push-status").textContent = "Push setup failed: " + e.message; }
}
$("#push").onclick = enablePush;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
