# Standing work (managed partly by the COO; edits are logged in the brain).

- name: ops-review
  agent: coo
  every_hours: 12
  priority: 4
  title: 'COO: ops review'
  task: 'Ops review: ops_metrics for 24h; fix stuck/failed tasks, nudge old approvals, manage budget, flag cost
    outliers and quality problems, propose brief changes where justified. Store one ops-review memory and report.'
- name: scout-rotation
  agent: job-scout
  every_hours: 6
  priority: 3
  title: 'Scout: fresh roles (rotating keywords)'
  task: 'Rotate through these keyword sets, picking the one you used least recently (check brain events tagged scout-rotation):
    (a) "machine learning engineer" (b) "AI engineer" (c) "computer vision engineer" (d) "data scientist" junior
    (e) "MLOps engineer" junior (f) "research engineer" ML. Search days=2, London then Remote UK. Log fit >= 3 that
    are not already in the brain. Do NOT create tailor tasks: Pribin taps "Tailor CV" on the phone for the roles he wants
    (a tailored pack costs ~140k tokens; most found roles are dismissed). If you logged any NEW role with fit >= 4, notify
    Pribin once: "<n> new roles worth a look: <company - title> ...". brain_remember a kind=event tagged scout-rotation
    naming the keyword set used.

    '
- name: warm-paths
  agent: networker
  every_hours: 48
  priority: 3
  title: 'Networker: one more company'
  task: 'Pick ONE company Pribin has APPLIED to or has a tailored pack for (job_status: status applied or tailored) that has no contacts yet (brain_query company:<slug>),
    find up to 3 relevant people and draft connection notes. Request approval. If every company is covered, say
    so.

    '
- name: lead-hunt
  agent: lead-finder
  every_hours: 3
  hours: 07-22
  priority: 4
  title: 'Lead-finder: fresh leads (speed wins)'
  task: 'Find new freelance leads posted in the LAST 24 HOURS for the offer in workspace/offer.md (letting agents and other
    small UK businesses first), not already in the brain. Log them; for fit >= 4 create the proposal task at priority 5
    immediately, so a proposal is drafted within the hour.

    '
- name: roadmap-sprint
  agent: project-manager
  every_hours: 6
  priority: 4
  title: 'Sprint: next roadmap milestone'
  task: 'Run a sprint on the next open milestone in workspace/roadmap.md (prefer finishing an in-progress project).
    Get it built, tested, reviewed, committed and pushed by release-manager. Update the roadmap. If every milestone
    is done, pick a project from the Proposed section, write its milestones, and start it.

    '
- name: nightly-tests
  agent: tester
  every_hours: 24
  priority: 2
  hours: 01-05
  title: 'Tester: run every project''s tests'
  task: 'For each project under workspace/projects/, run_tests and report pass/fail counts. For any failure, task_create
    "Fix failing tests in <project>" owner debugger with the exact output.

    '
- name: docs-refresh
  agent: docs-writer
  every_hours: 24
  priority: 2
  title: 'Docs: bring one README up to date'
  task: 'Pick the project under workspace/projects/ whose README is most out of date versus its code (check git
    log and the files). Rewrite the README truthfully, commit with git.

    '
- name: research-skim
  agent: ml-researcher
  every_hours: 12
  priority: 2
  title: 'Researcher: one credible item'
  task: 'Find ONE credible recent ML/AI item (paper, model release, UK hiring signal) not already in the brain,
    summarise it in 3 lines with the URL, store as kind=note tag research. If it suggests a project idea that fits
    the roadmap, append it under Proposed.

    '
- name: content-script
  agent: content-writer
  every_hours: 24
  priority: 2
  title: 'Content: one short-video script'
  task: 'Write one 30-60s script about something real the office did in the last 24h (brain events), save it, request
    approval.

    '
- name: linkedin-post
  agent: linkedin-writer
  every_hours: 48
  priority: 2
  title: 'LinkedIn: one post from real work'
  task: 'Write one LinkedIn post from a concrete thing in the brain from the last 2 days (a shipped milestone, a
    lesson, a number). Three variants, request approval.

    '
- name: pipeline-refresh
  agent: tracker
  every_hours: 12
  priority: 2
  title: 'Tracker: pipeline refresh'
  task: 'Refresh pipeline/jobs.md and pipeline/clients.md from the brain; create follow-up tasks for anything due.

    '
- name: weak-spot-drill
  agent: interview-coach
  every_hours: 12
  priority: 2
  title: 'Coach: drill the weakest spot'
  task: 'From weak-spot lessons in the brain, write a 10-minute drill on the weakest area to interviews/drills/<date>-weakspot.md
    with hidden model answers. If there are no weak spots yet, write a drill on model evaluation metrics.

    '
- name: evening-wrap
  agent: chief-of-staff
  every_hours: 24
  priority: 3
  hours: 20-23
  title: 'Chief: evening wrap-up and tomorrow''s plan'
  task: 'Summarise today: tasks done/failed, what shipped, approvals waiting, scorecard vs targets, and the three
    things the office will do tomorrow. Store as kind=event tag wrap, notify Pribin in one line.

    '
- name: light-gardening
  agent: chief-of-staff
  every_hours: 24
  priority: 1
  hours: 03-05
  title: 'Chief: light brain gardening'
  task: 'Delete exact-duplicate memories and job postings older than 30 days; merge obvious near-duplicates. Report
    counts.

    '
- name: review-latest
  agent: reviewer
  every_hours: 24
  priority: 2
  title: 'Reviewer: review the latest commits'
  task: 'For the project with the most recent commit under workspace/projects/, review the last 3 commits (git log,
    git diff) for bugs, secrets, and README accuracy. Store the verdict; task_create fixes for the debugger if needed.

    '
- name: strategy-lab
  agent: trading-learner
  every_hours: 24
  priority: 3
  hours: 17-23
  title: 'Learner: strategy lab (walk-forward)'
  task: 'Strategy lab: read the playbook, test 2-3 strategy families on 1-2 instruments with walk_forward, save
    candidates, approve only what passes, update trading/plan.md.'
- name: trading-study
  agent: trading-learner
  every_hours: 24
  priority: 2
  hours: 05-08
  title: 'Learner: daily study'
  task: 'Study: recall playbook topics relevant to this week''s journal, learn any new document in trading/library/,
    store 5 concrete lessons.'
- name: trading-weekly-review
  agent: trading-learner
  every_hours: 168
  priority: 3
  hours: 09-20
  title: 'Learner: weekly trading review'
  task: 'Weekly review: journal stats vs expectations per strategy; retire what failed on the evidence, change at
    most one thing and re-validate, update trading/plan.md, notify Pribin.'
# ---- every agent has standing work (Pribin, 2026-10-18: all 31 agents working at once). Outgoing actions stay approval-gated.
- name: proposal-best-lead
  agent: proposal-writer
  every_hours: 24
  priority: 3
  title: 'Proposal: best new lead'
  task: 'Check proposals/ first. Take the best freelance lead in the brain that has no proposal yet and write one (offer.md
    prices), then request_approval. If every lead already has a proposal, say so and stop.'
- name: qa-sweep
  agent: fact-checker
  every_hours: 12
  priority: 2
  title: 'QA: sweep unchecked drafts'
  task: 'list_files applications/, posts/, proposals/ and outbox/; fact_check the newest drafts that have no QA verdict yet
    (at most 3). Record each verdict on its approval.'
- name: build-roadmap-task
  agent: code-builder
  every_hours: 12
  priority: 3
  title: 'Build: next roadmap task'
  task: 'Take the oldest open coding task in workspace/roadmap.md, implement it in its project folder with tests, run them,
    commit locally, and report what changed.'
- name: bug-sweep
  agent: debugger
  every_hours: 12
  priority: 2
  title: 'Debug: one failing test'
  task: 'Run the tests in each project under workspace/projects/. Fix the root cause of ONE failure, prove it with the test,
    commit. If everything passes, say so.'
- name: agent-workshop
  agent: agent-builder
  every_hours: 24
  priority: 2
  title: 'Agent workshop'
  task: 'Advance workspace/projects/agent-templates one step: a reusable, tested agent or MCP tool template that a client
    could use (README, code, tiny test, commit). Free stack only.'
- name: app-milestone
  agent: app-developer
  every_hours: 24
  priority: 2
  title: 'App: one milestone'
  task: 'Advance the ONE app project named in workspace/roadmap.md (today: projects/ai-proposal-mobile) by one milestone: build,
    run, commit. Never start another app; if the roadmap names none, ask the project-manager with task_create and stop.'
- name: site-improve
  agent: web-builder
  every_hours: 24
  priority: 2
  title: 'Website: one improvement'
  task: 'Improve Pribin''s portfolio site in workspace/projects/portfolio-site one step (create it if missing): content from the
    brain only, build it, commit.'
- name: release-hygiene
  agent: release-manager
  every_hours: 12
  priority: 2
  title: 'Release: commit and push finished work'
  task: 'For each project under workspace/projects/ with finished, tested, uncommitted or unpushed work: review the diff,
    commit cleanly, update the changelog, push to Pribin''s GitHub (private unless told otherwise). git_push now tells Pribin
    and the brain about every push; if a project has nothing new, say "nothing new" and do not claim a release.'
- name: studio-planning
  agent: studio-lead
  every_hours: 12
  priority: 2
  title: 'Studio: scope the next job'
  task: 'Review the roadmap and the client pipeline; scope the next job into concrete tasks for the builders (task_create),
    each small enough to finish in one run.'
- name: market-deep-dive
  agent: market-researcher
  every_hours: 12
  priority: 2
  title: 'Market deep dive (DEMO desk)'
  task: 'Read trading/lab-sweep.md; pick one market with an approved or candidate strategy and research it: recent moves,
    volatility, scheduled events this week. Store facts in the brain (namespace trading). 10 lines.'
- name: candidate-analysis
  agent: strategy-analyst
  every_hours: 12
  priority: 2
  title: 'Strategy analysis: near-miss candidates'
  task: 'From trading/lab-sweep.md pick two candidate strategies; for each, run backtest_strategy with ONE sensible change
    and explain what holds it back. Hand findings to the trading-learner with task_create. Never save or approve strategies.'
- name: risk-review
  agent: risk-officer
  every_hours: 12
  priority: 2
  title: 'Risk review'
  task: 'Open positions, desk limits and exposure by asset class; flag risk concerns in the approved and candidate
    strategies (correlation, drawdown, gaps). Store findings in the brain. No orders.'
- name: execution-check
  agent: trader
  every_hours: 24
  priority: 2
  title: 'Execution readiness check (DEMO)'
  task: 'For each approved strategy: capital_market its epic and confirm it is tradeable, the minimum size and stop distance
    fit the desk rules, and note anything that would block an order. Store notes. Place no orders.'
- name: desk-ledger
  agent: portfolio-tracker
  every_hours: 12
  priority: 2
  title: 'Desk ledger'
  task: 'Reconcile treasury_status, trade_journal and capital_positions; update trading/ledger.md with balances, open risk
    and the week so far. Notify Pribin only if something does not reconcile.'
- name: skills-refresh
  agent: ml-researcher
  every_hours: 336
  priority: 2
  title: 'Skills refresh (current practice)'
  task: 'Skills refresh: check four guides for changes since their date and propose updates where material:
    rotate through uk-ml-job-market, cv-and-applications, ml-interviews, ai-agent-engineering, llm-security,
    python-engineering, web-development, mobile-desktop-apps, linkedin, short-video, freelance-market, uk-trading-rules,
    testing-and-quality (take the four with the oldest updated dates).'
# ---- Research Lab (2026-10-20): literature -> gap -> experiments -> paper -> review; Pribin is the author and submits
- name: research-pipeline
  agent: research-lead
  every_hours: 4
  hours: 17-23
  priority: 3
  title: 'Research pipeline: advance each project one stage'
  task: 'Research pipeline: call research_status (it reads the real project folders and rewrites research/STATUS.md; never
    hand-write STATUS.md). Advance each active project one stage by delegating to the right specialist, naming the
    project by its folder slug exactly. Start a new project from research/BACKLOG.md if fewer than 3 are active.'
- name: research-backlog
  agent: novelty-analyst
  every_hours: 48
  priority: 2
  title: 'Research backlog: three new candidate questions'
  task: 'Backlog: find three candidate research questions in the lab directions (agent memory and coordination, agent
    evaluation, small/local models, vision for robotics, agent safety); novelty_check each; append the survivors to
    research/BACKLOG.md with the closest-work evidence. No project folders yet.'
- name: lab-literature
  agent: literature-scout
  every_hours: 6
  priority: 2
  title: 'Lab: literature for the newest backlog question'
  task: 'Literature: take the newest question in research/BACKLOG.md that has no literature map yet, create research/<slug>/
    (slug from the question), build literature.md and references.bib for it. If every backlog question already has one, say so in one line.'
- name: lab-experiments
  agent: experimenter
  every_hours: 6
  priority: 3
  title: 'Lab: run the next pending experiment'
  task: 'Experiments: call research_status; for the first project at stage "experiments" whose results.json is missing or
    incomplete, implement and run the next step of its proposal plan and log the results. If none is at that stage, say so in one line.'
- name: lab-drafting
  agent: paper-writer
  every_hours: 6
  priority: 2
  title: 'Lab: draft or revise where results exist'
  task: 'Drafting: call research_status; for the first project at stage "draft" (logged results, no paper yet) write the
    paper; for any project with a review.md that has blocking issues, revise. Run paper_check. If nothing needs writing, say so in one line.'
- name: lab-review
  agent: peer-reviewer
  every_hours: 6
  priority: 2
  title: 'Lab: review the next draft'
  task: 'Review: read research/STATUS.md; review the first project at stage "review" that has no review.md newer than its
    paper.md. If none, say so in one line.'
# ---- new hires 2026-10-20 (Pribin): client success, books, compliance, support, data
- name: client-care
  agent: client-success
  every_hours: 24
  priority: 4
  title: 'Client success: onboarding, check-ins, follow-ups'
  task: 'Client care: for every deal in the brain (sent, won, paid) do the next step in your process: onboarding for new wins,
    the weekly check-in, the delivery handover, or the 14-day follow-up. Draft only; request approval for each email.'
- name: books
  agent: bookkeeper
  every_hours: 24
  priority: 3
  title: 'Books: reconcile deals, invoices, monthly P&L'
  task: 'Books: reconcile deals in the brain against workspace/finance/ledger.csv, draft any missing invoice for approval,
    update this month''s P&L, and list anything overdue in 3 lines.'
- name: compliance-sweep
  agent: compliance-officer
  every_hours: 24
  priority: 3
  title: 'Compliance sweep: proposals, outbox, posts, delivered projects'
  task: 'Compliance sweep: review what is new since your last sweep in proposals/, outbox/, posts/ and delivered projects;
    record issues with severity and the exact fix; request approval for anything high severity.'
- name: support-sweep
  agent: support-agent
  every_hours: 6
  priority: 4
  title: 'Support: client messages and open tickets'
  task: 'Support sweep: check the inbox for client messages about delivered projects, answer from the project docs (draft for
    approval), escalate bugs to the debugger, and chase open tickets older than 2 days.'
- name: data-task
  agent: data-engineer
  every_hours: 12
  priority: 2
  title: 'Data: next pipeline or the office analytics dataset'
  task: 'Data task: take the oldest open data task from the roadmap or the Studio; if none, advance the office-analytics
    dataset (clean, documented tables from office/logs for the Research Lab and the COO) one step, with a test and a README.'
- name: cv-refresh
  agent: application-tailor
  every_hours: 168
  priority: 2
  title: 'Tailor: keep the master CV current'
  task: 'Weekly: read the last 20 logged jobs (job_status) and list the skills and keywords they ask for most. Compare with
    workspace/cv/master-cv.md and propose, in a file workspace/cv/master-cv-suggestions.md, up to 5 truthful edits (only
    things Pribin has actually done; cv_truth_check them). Do not tailor for any job: Pribin taps Tailor CV himself.'
- name: outbox-hygiene
  agent: mail-assistant
  every_hours: 72
  requires_env: GMAIL_ADDRESS
  priority: 2
  title: 'Mail: sent emails still waiting for a reply'
  task: 'List the emails we sent (office/logs/mail_sent.jsonl via read_file) older than 7 days with no reply in the inbox
    (mail_inbox unread_only false, since_days 14). For each, if no follow-up task exists (task_list), task_create one for
    yourself is NOT allowed: instead draft the follow-up now with mail_reply (it becomes an approval). Max 3 per run.'
- name: security-audit
  agent: compliance-officer
  every_hours: 720
  priority: 3
  title: 'Compliance: monthly OWASP agentic security audit'
  task: 'Security audit: skill_read agentic-security-audit (the OWASP Top 10 for Agentic Applications). For each of the 10
    items check the office as it is now: read_brief for 6 agents with outward or shell tools (chief-of-staff, trader,
    mail-assistant, code-builder, release-manager, lead-finder), search_files for request_approval and tool allowlists,
    and the handbook. Write workspace/ops/security-audit-<YYYY-MM>.md: item, status (ok / gap), evidence (file:line),
    fix. For each gap task_create one task for coo with the fix. No web browsing needed; no fabricated findings:
    every gap must cite a file you read.'
