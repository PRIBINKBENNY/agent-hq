# Standing work (managed partly by the COO; edits are logged in the brain).

- name: ops-review
  agent: coo
  every_hours: 6
  priority: 4
  title: 'COO: ops review'
  task: 'Ops review: ops_metrics for 24h; fix stuck/failed tasks, nudge old approvals, manage budget, flag cost
    outliers and quality problems, propose brief changes where justified. Store one ops-review memory and report.'
- name: scout-rotation
  agent: job-scout
  every_hours: 6
  priority: 3
  title: 'Scout: fresh roles (rotating keywords)'
  task: 'Rotate through these keyword sets, picking the one you used least recently (check brain events tagged scout-rotation):
    (a) "machine learning engineer" (b) "AI engineer" (c) "computer vision engineer" (d) "data scientist" junior
    (e) "MLOps engineer" junior (f) "research engineer" ML. Search days=2, London then Remote UK. Log fit >= 3 that
    are not already in the brain. For any NEW role with fit >= 4, task_create "Tailor CV for <company> <role>" owner
    application-tailor (max 2 per run). brain_remember a kind=event tagged scout-rotation naming the keyword set
    used.

    '
- name: warm-paths
  agent: networker
  every_hours: 12
  priority: 3
  title: 'Networker: one more company'
  task: 'Pick ONE company from the brain''s jobs (fit >= 4) that has no contacts yet (brain_query company:<slug>),
    find up to 3 relevant people and draft connection notes. Request approval. If every company is covered, say
    so.

    '
- name: lead-hunt
  agent: lead-finder
  every_hours: 12
  priority: 2
  title: 'Lead-finder: two new leads'
  task: 'Find 2 new freelance leads for the offer in workspace/offer.md that are not already in the brain. Log them;
    for fit >= 4 create a proposal task.

    '
- name: roadmap-sprint
  agent: project-manager
  every_hours: 6
  priority: 4
  title: 'Sprint: next roadmap milestone'
  task: 'Run a sprint on the next open milestone in workspace/roadmap.md (prefer finishing an in-progress project).
    Get it built, tested, reviewed, committed and pushed by release-manager. Update the roadmap. If every milestone
    is done, pick a project from the Proposed section, write its milestones, and start it.

    '
- name: nightly-tests
  agent: tester
  every_hours: 24
  priority: 2
  hours: 01-05
  title: 'Tester: run every project''s tests'
  task: 'For each project under workspace/projects/, run_tests and report pass/fail counts. For any failure, task_create
    "Fix failing tests in <project>" owner debugger with the exact output.

    '
- name: docs-refresh
  agent: docs-writer
  every_hours: 24
  priority: 2
  title: 'Docs: bring one README up to date'
  task: 'Pick the project under workspace/projects/ whose README is most out of date versus its code (check git
    log and the files). Rewrite the README truthfully, commit with git.

    '
- name: research-skim
  agent: ml-researcher
  every_hours: 12
  priority: 2
  title: 'Researcher: one credible item'
  task: 'Find ONE credible recent ML/AI item (paper, model release, UK hiring signal) not already in the brain,
    summarise it in 3 lines with the URL, store as kind=note tag research. If it suggests a project idea that fits
    the roadmap, append it under Proposed.

    '
- name: content-script
  agent: content-writer
  every_hours: 24
  priority: 2
  title: 'Content: one short-video script'
  task: 'Write one 30-60s script about something real the office did in the last 24h (brain events), save it, request
    approval.

    '
- name: linkedin-post
  agent: linkedin-writer
  every_hours: 48
  priority: 2
  title: 'LinkedIn: one post from real work'
  task: 'Write one LinkedIn post from a concrete thing in the brain from the last 2 days (a shipped milestone, a
    lesson, a number). Three variants, request approval.

    '
- name: pipeline-refresh
  agent: tracker
  every_hours: 12
  priority: 2
  title: 'Tracker: pipeline refresh'
  task: 'Refresh pipeline/jobs.md and pipeline/clients.md from the brain; create follow-up tasks for anything due.

    '
- name: weak-spot-drill
  agent: interview-coach
  every_hours: 12
  priority: 2
  title: 'Coach: drill the weakest spot'
  task: 'From weak-spot lessons in the brain, write a 10-minute drill on the weakest area to interviews/drills/<date>-weakspot.md
    with hidden model answers. If there are no weak spots yet, write a drill on model evaluation metrics.

    '
- name: evening-wrap
  agent: chief-of-staff
  every_hours: 24
  priority: 3
  hours: 20-23
  title: 'Chief: evening wrap-up and tomorrow''s plan'
  task: 'Summarise today: tasks done/failed, what shipped, approvals waiting, scorecard vs targets, and the three
    things the office will do tomorrow. Store as kind=event tag wrap, notify Pribin in one line.

    '
- name: light-gardening
  agent: chief-of-staff
  every_hours: 24
  priority: 1
  hours: 03-05
  title: 'Chief: light brain gardening'
  task: 'Delete exact-duplicate memories and job postings older than 30 days; merge obvious near-duplicates. Report
    counts.

    '
- name: review-latest
  agent: reviewer
  every_hours: 24
  priority: 2
  title: 'Reviewer: review the latest commits'
  task: 'For the project with the most recent commit under workspace/projects/, review the last 3 commits (git log,
    git diff) for bugs, secrets, and README accuracy. Store the verdict; task_create fixes for the debugger if needed.

    '
- name: strategy-lab
  agent: trading-learner
  every_hours: 24
  priority: 3
  hours: 17-23
  title: 'Learner: strategy lab (walk-forward)'
  task: 'Strategy lab: read the playbook, test 2-3 strategy families on 1-2 instruments with walk_forward, save
    candidates, approve only what passes, update trading/plan.md.'
- name: trading-study
  agent: trading-learner
  every_hours: 24
  priority: 2
  hours: 05-08
  title: 'Learner: daily study'
  task: 'Study: recall playbook topics relevant to this week''s journal, learn any new document in trading/library/,
    store 5 concrete lessons.'
- name: trading-weekly-review
  agent: trading-learner
  every_hours: 168
  priority: 3
  hours: 09-20
  title: 'Learner: weekly trading review'
  task: 'Weekly review: journal stats vs expectations per strategy; retire what failed on the evidence, change at
    most one thing and re-validate, update trading/plan.md, notify Pribin.'
- name: mail-triage
  agent: mail-assistant
  every_hours: 2
  requires_env: GMAIL_ADDRESS
  priority: 4
  title: 'Mail: triage the inbox and answer customers'
  task: 'Mail triage: mail_inbox (unread, last 7 days). Skip newsletters, notifications and anything automated. For each real
    message from a client, lead, recruiter or contact: brain_recall the context, then mail_reply with a short, specific answer
    (auto-sent only inside existing known-contact threads when MAIL_AUTOREPLY is on; otherwise it becomes an approval).
    Record one brain event per handled message (tags contact:<slug>, email). Report: messages seen, replied, awaiting approval, skipped.'

# ---- every agent has standing work (Pribin, 2026-10-18: all 31 agents working at once). Outgoing actions stay approval-gated.
- name: tailor-best-role
  agent: application-tailor
  every_hours: 12
  priority: 3
  title: 'Tailor: best open role'
  task: 'Pick the highest-fit job in the job portal (job_status) that is still "found" and has no tailored CV yet. Tailor the
    master CV and write the cover letter, run cv_truth_check, export the PDF, then request_approval. Never submit.'
- name: proposal-best-lead
  agent: proposal-writer
  every_hours: 24
  priority: 3
  title: 'Proposal: best new lead'
  task: 'Check proposals/ first. Take the best freelance lead in the brain that has no proposal yet and write one (offer.md
    prices), then request_approval. If every lead already has a proposal, say so and stop.'
- name: qa-sweep
  agent: fact-checker
  every_hours: 12
  priority: 2
  title: 'QA: sweep unchecked drafts'
  task: 'list_files applications/, posts/, proposals/ and outbox/; fact_check the newest drafts that have no QA verdict yet
    (at most 3). Record each verdict on its approval.'
- name: build-roadmap-task
  agent: code-builder
  every_hours: 12
  priority: 3
  title: 'Build: next roadmap task'
  task: 'Take the oldest open coding task in workspace/roadmap.md, implement it in its project folder with tests, run them,
    commit locally, and report what changed.'
- name: bug-sweep
  agent: debugger
  every_hours: 12
  priority: 2
  title: 'Debug: one failing test'
  task: 'Run the tests in each project under workspace/projects/. Fix the root cause of ONE failure, prove it with the test,
    commit. If everything passes, say so.'
- name: agent-workshop
  agent: agent-builder
  every_hours: 24
  priority: 2
  title: 'Agent workshop'
  task: 'Advance workspace/projects/agent-templates one step: a reusable, tested agent or MCP tool template that a client
    could use (README, code, tiny test, commit). Free stack only.'
- name: app-milestone
  agent: app-developer
  every_hours: 24
  priority: 2
  title: 'App: one milestone'
  task: 'Advance the app project on the roadmap one milestone (or start a small Tauri or Flutter demo in workspace/projects/
    if none exists): build, run, commit.'
- name: site-improve
  agent: web-builder
  every_hours: 24
  priority: 2
  title: 'Website: one improvement'
  task: 'Improve Pribin''s portfolio site in workspace/projects/portfolio-site one step (create it if missing): content from the
    brain only, build it, commit.'
- name: release-hygiene
  agent: release-manager
  every_hours: 24
  priority: 2
  title: 'Release: commit and push finished work'
  task: 'For each project under workspace/projects/ with finished, tested, uncommitted or unpushed work: review the diff,
    commit cleanly, update the changelog, push to Pribin''s GitHub (private unless told otherwise).'
- name: studio-planning
  agent: studio-lead
  every_hours: 12
  priority: 2
  title: 'Studio: scope the next job'
  task: 'Review the roadmap and the client pipeline; scope the next job into concrete tasks for the builders (task_create),
    each small enough to finish in one run.'
- name: market-deep-dive
  agent: market-researcher
  every_hours: 6
  priority: 2
  title: 'Market deep dive (DEMO desk)'
  task: 'Read trading/lab-sweep.md; pick one market with an approved or candidate strategy and research it: recent moves,
    volatility, scheduled events this week. Store facts in the brain (namespace trading). 10 lines.'
- name: candidate-analysis
  agent: strategy-analyst
  every_hours: 12
  priority: 2
  title: 'Strategy analysis: near-miss candidates'
  task: 'From trading/lab-sweep.md pick two candidate strategies; for each, run backtest_strategy with ONE sensible change
    and explain what holds it back. Hand findings to the trading-learner with task_create. Never save or approve strategies.'
- name: risk-review
  agent: risk-officer
  every_hours: 12
  priority: 2
  title: 'Risk review'
  task: 'Open positions, desk limits and exposure by asset class; flag risk concerns in the approved and candidate
    strategies (correlation, drawdown, gaps). Store findings in the brain. No orders.'
- name: execution-check
  agent: trader
  every_hours: 24
  priority: 2
  title: 'Execution readiness check (DEMO)'
  task: 'For each approved strategy: capital_market its epic and confirm it is tradeable, the minimum size and stop distance
    fit the desk rules, and note anything that would block an order. Store notes. Place no orders.'
- name: desk-ledger
  agent: portfolio-tracker
  every_hours: 12
  priority: 2
  title: 'Desk ledger'
  task: 'Reconcile treasury_status, trade_journal and capital_positions; update trading/ledger.md with balances, open risk
    and the week so far. Notify Pribin only if something does not reconcile.'
